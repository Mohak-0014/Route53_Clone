name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Start the API on a freshly seeded database
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &

      - name: Build and start the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm start > ../frontend.log 2>&1 &

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/api/health > /dev/null && curl -sf localhost:3000/login > /dev/null && exit 0
            sleep 1
          done
          echo "Servers did not start"; cat backend.log frontend.log; exit 1

      - name: Run the e2e suite
        working-directory: e2e
        run: npm test

      - name: Upload screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/screenshots/
            backend.log
            frontend.log
