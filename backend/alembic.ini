# Alembic configuration. The database URL is not set here: migrations/env.py reads it from
# app.config.settings.database_url (the DATABASE_URL environment variable).
#
#   python -m alembic upgrade head                                   apply migrations
#   python -m alembic revision --autogenerate -m "..." --rev-id 0004   new revision from model changes
#   python -m alembic check                                          fail if models and migrations differ

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
